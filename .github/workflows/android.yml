name: Android

permissions:
  contents: write

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        required: false
        type: string

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Android project
        run: |
          npm run tauri -- android init --ci
          rm -f src-tauri/gen/android/app/src/main/res/drawable/ic_launcher_background.xml \
                src-tauri/gen/android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml
          cp -r src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/
          cmp -s src-tauri/icons/android/mipmap-xxxhdpi/ic_launcher.png src-tauri/gen/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cmp -s src-tauri/icons/android/mipmap-xxxhdpi/ic_launcher_foreground.png src-tauri/gen/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          # Release builds default to no cleartext. The UI talks to the on-device backend at http://127.0.0.1:8767.
          gradle=src-tauri/gen/android/app/build.gradle.kts
          grep -q 'usesCleartextTraffic"\] = "false"' "$gradle"
          sed -i 's/usesCleartextTraffic"\] = "false"/usesCleartextTraffic"] = "true"/' "$gradle"
          grep -q 'usesCleartextTraffic"\] = "false"' "$gradle" && exit 1
          grep -q 'usesCleartextTraffic"\] = "true"' "$gradle"
      - name: Version
        # The version lives in Cargo.toml only. Desktop builds read it from there; the Android build does
        # not, and without it the APK is versionName 1.0 / versionCode 1, which cannot update an installed app.
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          code=$(node scripts/publish-google-play.mjs --print-next-version-code --version "$version")
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$code" >> "$GITHUB_ENV"
      - name: Build APK and AAB
        run: npm run tauri -- android build --apk --aab --target aarch64 --ci --config "{\"version\":\"$APP_VERSION\",\"bundle\":{\"android\":{\"versionCode\":$APP_VERSION_CODE}}}"
      - name: Sign APK and AAB
        # Keys live in repository secrets, never in the repo. The APK is signed with key rotation:
        # Android 9+ checks the new key (v3 + lineage); Android 7-8 can only check the original key (v2),
        # so the old key still signs that block. The old key was leaked; the lineage denies it rollback,
        # so once a device has the rotated APK, builds signed only with the old key cannot update it.
        # The AAB for Google Play is signed with the new key, which is the registered upload key.
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_OLD_KEYSTORE_B64: ${{ secrets.ANDROID_OLD_KEYSTORE_B64 }}
          ANDROID_OLD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_OLD_KEYSTORE_PASSWORD }}
        run: |
          bt="$ANDROID_HOME/build-tools/35.0.0"
          new_ks="$RUNNER_TEMP/arduloops-release.p12"
          old_ks="$RUNNER_TEMP/arduloops-old.p12"
          trap 'rm -f "$new_ks" "$old_ks"' EXIT
          printf %s "$ANDROID_KEYSTORE_B64" | base64 -d > "$new_ks"
          printf %s "$ANDROID_OLD_KEYSTORE_B64" | base64 -d > "$old_ks"
          mkdir -p dist-apk
          unsigned=$(find src-tauri/gen/android -name '*.apk' -print -quit)
          aligned="$RUNNER_TEMP/arduloops-aligned.apk"
          "$bt/zipalign" -f -p 4 "$unsigned" "$aligned"
          out="dist-apk/ArduLoops_${APP_VERSION}_aarch64.apk"
          "$bt/apksigner" sign \
            --ks "$old_ks" --ks-pass env:ANDROID_OLD_KEYSTORE_PASSWORD --key-pass env:ANDROID_OLD_KEYSTORE_PASSWORD \
            --next-signer \
            --ks "$new_ks" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --lineage src-tauri/android-signing.lineage \
            --rotation-min-sdk-version 28 \
            --out "$out" \
            "$aligned"
          "$bt/apksigner" verify --verbose "$out"
          new_cert=09825e2c87aa57923cd59b63f6c659afc21c224ee3d6cba0f646c8571e19a038
          "$bt/apksigner" verify --print-certs --min-sdk-version 28 "$out" | grep -q "SHA-256 digest: $new_cert" || { echo "APK is not signed with the new key for Android 9+"; exit 1; }
          # An APK whose versionCode is not this release's cannot update the installed app.
          badging=$("$bt/aapt2" dump badging "$out" | head -1)
          echo "$badging"
          echo "$badging" | grep -q "versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION'" || { echo "APK version is not $APP_VERSION ($APP_VERSION_CODE)"; exit 1; }
          unsigned_aab=$(find src-tauri/gen/android -name '*.aab' -print -quit)
          out_aab="dist-apk/ArduLoops_${APP_VERSION}_aarch64.aab"
          cp "$unsigned_aab" "$out_aab"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$new_ks" \
            -storetype PKCS12 \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEYSTORE_PASSWORD \
            "$out_aab" arduloops-release
          jarsigner -verify -verbose "$out_aab" >/dev/null
          ls -l dist-apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            dist-apk/*.apk
            dist-apk/*.aab
      - name: Upload to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist-apk/*.apk dist-apk/*.aab --clobber
      - name: Publish to Google Play
        if: inputs.tag != '' || github.event_name == 'workflow_dispatch'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/publish-google-play.mjs --aab "dist-apk/ArduLoops_${APP_VERSION}_aarch64.aab" --version "$APP_VERSION" --version-code "$APP_VERSION_CODE"
